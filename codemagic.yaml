workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      vars:
        APP_NAME: "Corillo"
        BUNDLE_ID: "com.corillo.dominoScore"
        FLUTTER_BUILD_NAME: "1.0.0"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.corillo.dominoScore

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set iOS build number
        script: |
          BUILD_NUMBER=$(($BUILD_NUMBER + 1))
          echo "Using build number: $BUILD_NUMBER"

      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --build-name=$FLUTTER_BUILD_NAME \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
