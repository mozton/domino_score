workflows:
  ios-release:
    name: iOS Release

    environment:
      flutter: stable

      groups:
        - app_secrets

      ios_signing:
        distribution_type: app_store
        bundle_identifier: $APPLE_BUNDLE_ID

    scripts:
      # 1. Crear archivo .env con las variables configuradas en Codemagic
      - name: Create .env file
        script: |
          cat <<EOF > .env
          APPLE_BUNDLE_ID=$APPLE_BUNDLE_ID
          SECRET_KEY=$SECRET_KEY
          CLIENT_ID=$CLIENT_ID
          FIREBASE_TOKEN=$FIREBASE_TOKEN
          ROBOFLOW_API_KEY=$ROBOFLOW_API_KEY
          EOF

      # 2. Instalar dependencias
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      # 3. Build iOS app
      - name: Build iOS ipa
        script: |
          # Extraer el build number actual del pubspec.yaml (ej: 1.0.0+14 -> 14)
          # Extraer el build number actual del pubspec.yaml (ej: 1.0.0+14 -> 14)
          PUBSPEC_BUILD_NUMBER=$(awk -F'+' '/^version:/ {print $2}' pubspec.yaml)
          
          # Asegurarse de que sea un número. Si falla, usar 14.
          if ! [[ "$PUBSPEC_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            PUBSPEC_BUILD_NUMBER=14
          fi
          
          # Usar BUILD_NUMBER de Codemagic (que siempre existe). Si por alguna razón está vacío, usar 1.
          CM_RUN_NUMBER=${BUILD_NUMBER:-1}
          if [ -z "$CM_RUN_NUMBER" ]; then CM_RUN_NUMBER=1; fi
          
          # Sumar para obtener un número mayor al de TestFlight
          NEXT_BUILD_NUMBER=$((PUBSPEC_BUILD_NUMBER + CM_RUN_NUMBER))
          
          # Seguro adicional: Si el resultado sigue siendo 14 o menor, forzarlo a 15.
          if [ "$NEXT_BUILD_NUMBER" -le 14 ]; then
            NEXT_BUILD_NUMBER=$((14 + CM_RUN_NUMBER))
          fi
          
          echo "Build number base (pubspec): $PUBSPEC_BUILD_NUMBER"
          echo "Codemagic run number: $CM_RUN_NUMBER"
          echo "=> Build Number final a usar: $NEXT_BUILD_NUMBER"

          flutter build ipa \
            --release \
            --build-number=$NEXT_BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
