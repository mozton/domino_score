workflows:
  ios-release:
    name: iOS Release

    environment:
      flutter: stable

      groups:
        - app_secrets

      ios_signing:
        distribution_type: app_store
        bundle_identifier: $APPLE_BUNDLE_ID

    scripts:
      # 1. Crear archivo .env con las variables configuradas en Codemagic
      - name: Create .env file
        script: |
          cat <<EOF > .env
          APPLE_BUNDLE_ID=$APPLE_BUNDLE_ID
          SECRET_KEY=$SECRET_KEY
          CLIENT_ID=$CLIENT_ID
          FIREBASE_TOKEN=$FIREBASE_TOKEN
          ROBOFLOW_API_KEY=$ROBOFLOW_API_KEY
          EOF

      # 2. Instalar dependencias
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      # 3. Build iOS app
      - name: Build iOS ipa
        script: |
          # Extraer el build number actual del pubspec.yaml (ej: 1.0.0+14 -> 14)
          PUBSPEC_BUILD_NUMBER=$(awk -F'+' '/^version:/ {print $2}' pubspec.yaml)
          
          # Asegurarse de que sea un número. Si falla, usar 1.
          if ! [[ "$PUBSPEC_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            PUBSPEC_BUILD_NUMBER=1
          fi
          
          # Sumar el número de build de Codemagic para que siempre sea único e incremental
          # Codemagic PROJECT_BUILD_NUMBER se incrementa en +1 con cada build
          BUILD_NUMBER=$((PUBSPEC_BUILD_NUMBER + PROJECT_BUILD_NUMBER))
          
          echo "Build number base (pubspec): $PUBSPEC_BUILD_NUMBER"
          echo "Codemagic build number: $PROJECT_BUILD_NUMBER"
          echo "=> Build Number final a usar: $BUILD_NUMBER"

          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
